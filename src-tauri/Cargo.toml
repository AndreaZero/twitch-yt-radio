[package]
name = "background-audio"
version = "0.1.0"
description = "Player compatto audio e video per YouTube e Twitch"
authors = ["Andrea"]
edition = "2021"

[lib]
name = "background_audio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["time", "macros", "sync", "net", "io-util"] }
base64 = "0.22"
rand = "0.9"
sha2 = "0.10"
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", features = ["sink"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_Security_Credentials", "Win32_System_Registry", "Win32_Security_WinTrust", "Win32_Security_Cryptography"] }
