[package]
name = "background-audio"
version = "0.1.0"
description = "Player compatto audio e video per YouTube e Twitch"
authors = ["Andrea"]
edition = "2021"

[lib]
name = "background_audio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
